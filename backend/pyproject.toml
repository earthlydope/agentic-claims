[project]
name = "agentic-claims-backend"
version = "1.0.0"
description = "Agentic Motor Claims Platform — zero-trust ADK agents for Allianz Austria (demo)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "google-adk>=2.0.0,<3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"
